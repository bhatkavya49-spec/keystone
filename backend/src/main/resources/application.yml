spring:
  application:
    name: keystone-backend

  datasource:
    # TODO: Replace these environment variables with your PostgreSQL configuration.
    # Required values: DB_NAME, DB_USERNAME, DB_PASSWORD.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Initial schema from Hibernate
